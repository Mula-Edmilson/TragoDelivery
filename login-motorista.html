<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Motorista - Trago Delivery</title>
  
  <!-- CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-[#F7F8F3] min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Faixa Superior de Aviso Mobile -->
  <div class="w-full max-w-md mb-4 bg-amber-50 border border-amber-200 rounded p-3 text-xs text-amber-800 flex items-center gap-2">
    <i class="fas fa-info-circle text-amber-600 shrink-0"></i>
    <span>Para o correto funcionamento do rastreamento, autorize o acesso à sua localização no ecrã seguinte.</span>
  </div>

  <div class="w-full max-w-md bg-white rounded-lg shadow-xl overflow-hidden border border-gray-200 flex flex-col">
    
    <!-- Cabeçalho -->
    <div class="bg-[#2F7A3C] text-white p-6 text-center relative">
      <div class="absolute top-3 right-3">
        <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-white/20 uppercase tracking-widest">
          Frota
        </span>
      </div>
      
      <div class="w-12 h-12 rounded-full bg-white text-[#2F7A3C] flex items-center justify-center mx-auto text-xl font-bold shadow mb-3">
        <i class="fas fa-truck-fast"></i>
      </div>

      <h1 class="text-xl font-bold tracking-tight">TRAGO DELIVERY</h1>
      <p class="text-xs text-green-100 mt-1">Portal do Motorista</p>
    </div>

    <!-- Formulário -->
    <div class="p-6 md:p-8 flex-1 flex flex-col justify-between">
      
      <form id="form-driver-login" onsubmit="window.Auth.handleLogin(event, 'driver')" class="space-y-4">
        
        <div>
          <label for="email" class="block text-xs font-semibold text-[#50494B] uppercase tracking-wider mb-1">
            Seu Email
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fas fa-user text-sm"></i>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email" 
              required
              placeholder="carlos@tragodelivery.co.mz" 
              class="w-full pl-10 pr-3 py-3 bg-gray-50 border border-gray-300 rounded text-sm focus:outline-none focus:border-[#2F7A3C] focus:bg-white transition-colors"
            >
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-[#50494B] uppercase tracking-wider mb-1">
            Sua Senha
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fas fa-lock text-sm"></i>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required
              placeholder="••••••••" 
              class="w-full pl-10 pr-3 py-3 bg-gray-50 border border-gray-300 rounded text-sm focus:outline-none focus:border-[#2F7A3C] focus:bg-white transition-colors"
            >
          </div>
        </div>

        <div class="pt-3">
          <button 
            type="submit" 
            class="w-full py-3.5 bg-[#C97813] hover:bg-[#a86410] text-white font-bold rounded shadow transition-colors flex items-center justify-center gap-2 text-sm"
          >
            <i class="fas fa-route"></i> Aceder às Entregas
          </button>
        </div>

      </form>

      <div class="mt-8 pt-4 border-t border-gray-100 text-center">
        <p class="text-xs text-gray-500">
          É Administrador? 
          <a href="login.html" class="text-[#2F7A3C] font-bold hover:underline">Aceder à Gestão Central</a>
        </p>
      </div>

    </div>

  </div>

  <!-- Scripts -->
  <script src="js/common/api.js"></script>
  <script src="js/common/ui.js"></script>
  <script src="js/common/auth.js"></script>

  <script>
    if (localStorage.getItem('driverToken')) {
      window.location.href = 'painel-de-entrega.html';
    }
  </script>
</body>
</html>
